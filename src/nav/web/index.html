<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>실내 길안내</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 화면 읽기 프로그램(VoiceOver·TalkBack)이 안내 문장을 읽도록 -->
<div id="live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

<!-- 1. 처음 설정 (한 번만): 접속 코드 + 기능 점검 + 시험 설정(영상 파일·화질) -->
<section id="setup" hidden>
  <h1>실내 길안내</h1>
  <form id="code-form" class="card">
    <label for="code">접속 코드</label>
    <div class="row">
      <input id="code" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">확인</button>
    </div>
  </form>
  <ul id="checks" class="checks" aria-label="기능 점검 결과"></ul>
  <div class="card">
    <h2>시험 설정</h2>
    <label class="row">화질
      <select id="quality"><option value="720">보통 (720)</option><option value="1080">고화질 (1080)</option></select>
    </label>
    <label class="row"><input id="ultrawide" type="checkbox" disabled> 초광각 카메라 0.5x (확인되면 켤 수 있음)</label>
    <button id="cam-check" type="button" aria-label="카메라 목록 확인">카메라 목록 확인 (초광각 찾기)</button>
    <ul id="cam-list" aria-live="polite"></ul>
    <label class="row"><input id="slowwarn" type="checkbox" checked> 응답이 8초 넘게 없으면 "잠시 멈춰 주세요"</label>
    <label class="row"><input id="sensors" type="checkbox" checked> 센서 즉시 안내 (회전 확인·걸음 수)</label>
    <label class="row"><input id="quickconf" type="checkbox" checked> 빠른 확인 (목적지를 보면 사진 2장을 더 찍어 확인)</label>
    <label class="col">영상 파일로 시험 (고르면 카메라 대신 이 영상을 실제 속도로 재생해 보냅니다. 두 번째 파일부터는 엘리베이터에서 내린 것으로 처리)
      <input id="files" type="file" accept="video/*" multiple>
    </label>
    <div class="row"><span id="src" class="muted">카메라 사용</span> <button type="button" id="clear-files">카메라로</button></div>
  </div>
  <div class="row links">
    <a href="/records" target="_blank">다시보기 기록</a>
    <a href="/monitor" target="_blank">관찰자 화면</a>
    <button type="button" id="to-dest" class="primary">목적지 화면으로</button>
  </div>
  <p class="muted">처음 화면을 누를 때 카메라·방향 센서·움직임 센서·소리·화면 꺼짐 방지를 한 번에 묻습니다.</p>
</section>

<!-- 2. 목적지: 화면 아무 곳이나 길게 누른 채 말한다 (확인 질문 없음) -->
<section id="dest-page" hidden>
  <button type="button" id="open-setup" class="corner nohold" aria-label="설정">설정</button>
  <div class="hint" aria-hidden="true">
    <p class="big">화면을 길게 누른 채<br>목적지를 말하세요</p>
    <p class="muted" id="mode-line"></p>
  </div>
  <form id="dest-form" class="nohold dest-form">
    <label for="dest" class="sr-only">목적지 글자로 입력</label>
    <input id="dest" type="text" placeholder="또는 글자로: 410호" autocomplete="off" enterkeyhint="go">
    <button type="submit">보내기</button>
  </form>
  <div class="caption" id="caption0" aria-hidden="true"></div>
</section>

<!-- 3. 안내: 카메라 전체 화면 + 위쪽 목적지·상태·응답 시간 + 아래쪽 큰 자막 -->
<section id="guide" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div id="top" aria-hidden="true"><span id="t-dest">-</span><span id="t-state">-</span><span id="t-time">-</span></div>
  <div id="busy" class="dot" hidden aria-hidden="true"></div>
  <div id="detail" class="detail nohold" hidden></div>
  <div id="bottom">
    <div class="caption" id="caption" aria-hidden="true"></div>
    <div id="errline" class="err" hidden></div>
    <div class="btns nohold">
      <button type="button" id="repeat">다시 듣기</button>
      <button type="button" id="more" aria-expanded="false">자세히</button>
      <button type="button" id="exited">내렸어요</button>
      <button type="button" id="end">끝내기</button>
    </div>
  </div>
</section>

<div id="rec-overlay" class="rec" hidden aria-hidden="true">듣는 중… 손을 떼면 보냅니다</div>

<script src="sensors.js"></script>
<script src="app.js?v=20261119b"></script>
</body>
</html>
